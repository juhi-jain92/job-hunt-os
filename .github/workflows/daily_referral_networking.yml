name: Daily Referral + Networking Queue

# 16:00 UTC = 9:00 AM Pacific (daylight time; 8:00 AM in winter — cron has no
# timezone support, adjust to '0 17 * * *' after the November switch if the
# 9am anchor matters).
#
# Queues only, never sends: referral_match fills the Referrals tab from
# whatever 7+ scores exist; networking_daily queues cold prospects with a
# 14-day per-company cooldown. Both are no-ops for anything already handled.
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode Google service account key
        run: |
          mkdir -p credentials
          echo "${{ secrets.GOOGLE_SHEETS_KEY }}" | base64 --decode > credentials/sheets_key.json

      - name: Create .env file
        run: |
          echo "APIFY_TOKEN=${{ secrets.APIFY_TOKEN }}" >> .env
          echo "HUNTER_API_KEY=${{ secrets.HUNTER_API_KEY }}" >> .env

      - name: Referral match — 7+ roles vs warm contacts
        run: python3 referral_match.py

      - name: Networking — queue today's cold prospects
        if: always()
        run: python3 networking_daily.py
